<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShueibLive - بث المباريات مباشرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold-dim: #b89a00;
    --black: #000000;
    --dark: #0a0a0a;
    --dark2: #111111;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Cairo', sans-serif;
    overflow-x: hidden;
  }

  /* ===== NOISE OVERLAY ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 2rem;
    text-align: center;
  }

  /* Stadium lights background */
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(255,215,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 0%, rgba(255,215,0,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(255,215,0,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Pitch lines */
  .pitch-lines {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .pitch-lines::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,215,0,0.08), transparent);
  }
  .pitch-lines::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1px solid rgba(255,215,0,0.06);
  }

  /* ===== LOGO ===== */
  .logo-wrap {
    position: relative;
    margin-bottom: 2rem;
    animation: fadeDown 0.8s ease both;
  }

  .logo-icon {
    width: 90px;
    height: 90px;
    background: var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    position: relative;
    box-shadow: 0 0 40px rgba(255,215,0,0.4), 0 0 80px rgba(255,215,0,0.15);
    animation: pulse 3s ease-in-out infinite;
  }

  .logo-icon svg {
    width: 48px;
    height: 48px;
    fill: var(--black);
  }

  /* Live dot */
  .live-badge {
    position: absolute;
    top: -4px;
    left: -4px;
    background: #ff3030;
    color: white;
    font-size: 0.55rem;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 1px;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(255,215,0,0.4), 0 0 80px rgba(255,215,0,0.15); }
    50% { box-shadow: 0 0 60px rgba(255,215,0,0.6), 0 0 120px rgba(255,215,0,0.25); }
  }

  /* ===== TITLE ===== */
  .brand-name {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    animation: fadeDown 0.8s 0.1s ease both;
  }

  .brand-name span {
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,215,0,0.5);
  }

  .tagline {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: rgba(255,255,255,0.5);
    margin-top: 0.75rem;
    font-weight: 400;
    animation: fadeDown 0.8s 0.2s ease both;
  }

  /* ===== VERSION BADGE ===== */
  .version-wrap {
    margin-top: 2.5rem;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .version-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 100px;
    padding: 0.4rem 1.2rem;
    font-size: 0.85rem;
    color: var(--gold);
    background: rgba(255,215,0,0.05);
    backdrop-filter: blur(10px);
  }

  .version-dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
  }

  /* ===== CTA SECTION ===== */
  .cta-section {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .btn-main {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--gold);
    color: var(--black);
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    padding: 1rem 2.5rem;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .btn-main::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    border-radius: inherit;
  }

  .btn-main:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 50px rgba(255,215,0,0.5);
  }

  .btn-main svg {
    width: 20px;
    height: 20px;
  }

  .coming-text {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.3);
    direction: rtl;
  }

  /* ===== FEATURES ===== */
  .features {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4rem;
    padding: 0 1rem;
    animation: fadeUp 0.8s 0.5s ease both;
  }

  .feat {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 0.6rem 1rem;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
  }

  .feat-icon {
    color: var(--gold);
    font-size: 1rem;
  }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    padding: 2rem;
    color: rgba(255,255,255,0.2);
    font-size: 0.75rem;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 4rem;
  }

  footer span { color: var(--gold); opacity: 0.6; }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== SCROLL LINE ===== */
  .gold-line {
    width: 60px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 1.5rem auto 0;
    animation: fadeUp 0.8s 0.25s ease both;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="pitch-lines"></div>

  <div class="logo-wrap">
    <div class="logo-icon">
      <span class="live-badge">LIVE</span>
      <!-- Football icon -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="28" fill="none" stroke="#000" stroke-width="4"/>
        <polygon points="32,10 38,22 52,22 42,30 46,44 32,36 18,44 22,30 12,22 26,22" fill="#000" opacity="0.15"/>
        <circle cx="32" cy="32" r="28" fill="none" stroke="#000" stroke-width="3.5"/>
        <!-- Pentagon pattern -->
        <path d="M32 8 L40 20 L52 18 L54 30 L44 38 L46 50 L32 46 L18 50 L20 38 L10 30 L12 18 L24 20 Z" fill="none" stroke="#000" stroke-width="2"/>
        <circle cx="32" cy="32" r="6" fill="#000" opacity="0.2"/>
      </svg>
    </div>
  </div>

  <div class="brand-name">Shueib<span>Live</span></div>
  <div class="tagline">شاهد المباريات مباشرة — في أي وقت، من أي مكان</div>
  <div class="gold-line"></div>

  <div class="version-wrap">
    <div class="version-badge">
      <div class="version-dot"></div>
      الإصدار 1.0 — قريباً
    </div>
  </div>

  <div class="cta-section">
    <a href="#" class="btn-main">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      حمّل التطبيق قريباً
    </a>
    <p class="coming-text">🔔 سيتوفر على Android</p>
  </div>

  <div class="features">
    <div class="feat"><span class="feat-icon">⚡</span> بث فوري بدون تأخير</div>
    <div class="feat"><span class="feat-icon">🏆</span> أكبر البطولات العالمية</div>
    <div class="feat"><span class="feat-icon">📱</span> متوافق مع جميع الأجهزة</div>
    <div class="feat"><span class="feat-icon">🆓</span> مجاني بالكامل</div>
  </div>
</div>

<footer>
  <p>جميع الحقوق محفوظة &copy; 2025 <span>ShueibLive</span></p>
</footer>

</body>
</html>
